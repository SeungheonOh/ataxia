<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Applications</title>
<link rel="stylesheet" href="../../world/web/ui/document.css"><style>#panel{height:100%;border:1px solid var(--ink);padding:0 8px}#query{width:100%;height:18px;border:0;border-bottom:1px solid var(--ink);padding:0}#results button{display:block;width:100%;overflow:hidden;text-overflow:ellipsis}</style>
<script src="../../world/web/ui/document.js" defer></script></head><body class="shell"><div id="panel"><input id="query" data-value="query" data-edited="search" placeholder="Search applications and windows…" autofocus><div id="results"><button id="result-0" data-action="activate" data-argument="0"><span id="result-title-0" data-property="result-title-0"></span></button><button id="result-1" data-action="activate" data-argument="1"><span id="result-title-1" data-property="result-title-1"></span></button><button id="result-2" data-action="activate" data-argument="2"><span id="result-title-2" data-property="result-title-2"></span></button><button id="result-3" data-action="activate" data-argument="3"><span id="result-title-3" data-property="result-title-3"></span></button><button id="result-4" data-action="activate" data-argument="4"><span id="result-title-4" data-property="result-title-4"></span></button><button id="result-5" data-action="activate" data-argument="5"><span id="result-title-5" data-property="result-title-5"></span></button></div></div><script>let current=0,count=0,shown=false,state={};addEventListener('ui-state',({detail:s})=>{state=s;count=s['result-count']||0;if(s['selected-index']!==undefined)current=Number(s['selected-index']);document.querySelectorAll('#results button').forEach((n,i)=>{n.hidden=i>=count;n.classList.toggle('selected',i===current);});if(s.shown&&!shown)document.getElementById('query').focus();shown=s.shown;});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();ataxiaUiSend('dismiss',null);}else if(e.key==='Enter'){e.preventDefault();if(count)ataxiaUiSend('activate',String(current));}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();current=Math.max(0,Math.min(count-1,current+(e.key==='ArrowDown'?1:-1)));state['selected-index']=current;document.querySelectorAll('#results button').forEach((n,i)=>n.classList.toggle('selected',i===current));}});</script></body></html>
