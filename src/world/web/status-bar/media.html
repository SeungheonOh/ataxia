<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sound and media</title><style>
body { margin:0; width:100%; height:100%; font-size:13px; }
div { display:block; box-sizing:border-box; }
#panel { width:100%; height:100%; padding:0 var(--inset); border:var(--frame) solid var(--ink); display:flex; flex-direction:column; }
#header, .row, #transport { display:flex; align-items:center; gap:0 var(--gap); }
#header { height:var(--control); flex-shrink:0; }
#title { font-size:var(--heading); font-weight:bold; }
#close, #mute { margin-left:auto; }
#content { flex:1; min-height:0; overflow-y:auto; }
.label { font-weight:bold; flex-shrink:0; }
#volume-value { min-width:0; font-size:12px; }
#volume { display:block; width:100%; height:var(--field-height); }
#volume:disabled { opacity:0.4; }
.hint { font-size:11px; line-height:16px; }
#device, #artist { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#media-section { display:none; }
.has-player #media-section { display:block; }
.has-player #empty { display:none; }
#player-row { gap:0 var(--column-gap); }
#player { flex:1; min-width:0; flex-shrink:1; text-align:left; overflow:hidden; text-overflow:ellipsis; }
#track { font-weight:bold; max-height:32px; overflow:hidden; word-break:break-word; }
#artist { font-size:12px; }
#transport { flex-wrap:wrap; }
#playback { margin-left:auto; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style><link rel="stylesheet" href="../ui/document.css"><style>#close { width:auto; min-width:5ch; }</style><script src="../ui/document.js" defer="defer"></script></head><body class="shell shell-media"><div id="panel">
<div id="header"><div id="title">Sound &amp; media</div><input id="close" class="button" type="button" value="Close"></div>
<div id="content"><div class="row"><div class="label">Volume</div><div id="volume-value">Unavailable</div><input id="mute" class="button" type="button" value="Mute" data-disabled="audio_disabled"></div>
<input id="volume" type="range" min="0" max="100" step="1" data-value="volume" data-disabled="audio_disabled">
<div id="device" class="hint">Connecting to audio…</div>
<div id="empty" class="hint">No media playing</div>
<div id="media-section"><div id="player-row" class="row"><div class="label">Player</div><input id="player" class="button" type="button" value="No media player" data-disabled="player_disabled"></div>
<div id="track"></div><div id="artist"></div>
<div id="transport"><input id="previous" class="button" type="button" value="Previous" data-disabled="previous_disabled"><input id="play" class="button" type="button" value="Play" data-disabled="play_disabled"><input id="next" class="button" type="button" value="Next" data-disabled="next_disabled"><div id="playback" class="hint"></div></div>
</div></div></div></body></html>
