<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Viewport motion</title>
<link rel="stylesheet" href="../../world/web/ui/document.css"><style>body{background:transparent}svg{width:100%;height:100%}</style>
<script src="../../world/web/ui/document.js" defer></script></head><body class="shell"><svg xmlns="http://www.w3.org/2000/svg"><g id="anchor"><circle r="42" fill="none" stroke="white" stroke-width="3"/><circle r="42" fill="none" stroke="#161616"/><rect x="-3" y="-3" width="6" height="6" fill="#161616" stroke="white"/></g><path id="backing" stroke="white" stroke-width="3"/><path id="direction" stroke="#161616"/></svg><script>addEventListener('ui-state',({detail:s})=>{const x=s['anchor-x']||0,y=s['anchor-y']||0;document.getElementById('anchor').setAttribute('transform',`translate(${x} ${y})`);const d=`M${x} ${y}L${s['cursor-x']??x} ${s['cursor-y']??y}`;for(const id of ['backing','direction'])document.getElementById(id).setAttribute('d',d);});</script></body></html>
