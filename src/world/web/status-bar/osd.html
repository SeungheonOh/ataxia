<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>System control</title><style>
body { margin:0; width:100%; height:100%; font-size:13px; }
div { display:block; box-sizing:border-box; }
#panel { width:100%; height:100%; border:var(--frame) solid var(--ink); padding:0 var(--inset); }
#heading { display:flex; align-items:center; gap:0 var(--gap); height:var(--control); }
#label { flex:1; font-weight:bold; white-space:nowrap; overflow:hidden; }
#value { font-size:14px; font-weight:bold; }
#track { height:8px; border:var(--frame) solid var(--ink); margin:0; }
#fill { height:100%; width:50%; }
#detail { height:16px; font-size:11px; white-space:nowrap; overflow:hidden; }
.media #track { display:none; }
.media #detail { margin-top:0; }
</style><link rel="stylesheet" href="../ui/document.css"><style>#close { width:auto; min-width:5ch; }</style><script src="../ui/document.js" defer="defer"></script></head><body class="shell shell-osd"><div id="panel"><div id="heading"><div id="label">Brightness</div><div id="value">50%</div></div><div id="track"><div id="fill"></div></div><div id="detail">Display backlight</div></div></body></html>
