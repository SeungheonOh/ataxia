<!doctype html>
<html lang="en"><head><title>Agent sessions</title><style>
body { margin:0; width:100%; height:100%; font-size:13px; }
div { display:block; box-sizing:border-box; }
body { font-size:12px; }
#panel { position:absolute; left:0; top:0; overflow-y:auto; border:var(--frame) solid var(--ink); }
#content { padding:0 var(--inset); }
#header { display:flex; align-items:center; gap:0 var(--gap); height:var(--control); }
#heading { flex:1; min-width:0; font-weight:bold; font-size:var(--heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pause-all { font-size:11px; }
#empty { margin-top:0; }
.card { display:none; margin-top:0; }
.title { display:flex; align-items:center; gap:0 var(--gap); }
.dot { width:8px; height:8px; }
.name { flex:1; min-width:0; font-weight:bold; font-size:13px; overflow:hidden; white-space:nowrap; }
.state { margin-left:auto; flex-shrink:0; font-size:11px; }
.detail { min-height:16px; margin-top:0; }
.scope { font-size:11px; margin-top:0; }
.actions { display:flex; flex-wrap:wrap; gap:0 var(--gap); margin-top:0; }
.actions button { font-size:12px; }
#hint { font-size:11px; margin-top:0; }
</style><meta charset="utf-8"><link rel="stylesheet" href="../web/ui/document.css"><script src="../web/ui/document.js" defer="defer"></script></head><body class="shell computer-use-panel"><div id="panel"><div id="content">
<div id="header"><div id="heading">Agent sessions</div><button id="pause-all">Pause all</button></div>
<div id="empty">Agents appear here when they connect.</div>
<div id="card0" class="card"><div class="title"><div id="dot0" class="dot"></div><div id="name0" class="name">Agent</div><div id="state0" class="state">ACTIVE</div></div><div id="detail0" class="detail"></div><div id="scope0" class="scope"></div><div class="actions"><button id="resume0" class="resume">Resume</button><button id="pause0">Pause</button><button id="stop0" class="stop">Disconnect</button></div></div>
<div id="card1" class="card"><div class="title"><div id="dot1" class="dot"></div><div id="name1" class="name">Agent</div><div id="state1" class="state">ACTIVE</div></div><div id="detail1" class="detail"></div><div id="scope1" class="scope"></div><div class="actions"><button id="resume1" class="resume">Resume</button><button id="pause1">Pause</button><button id="stop1" class="stop">Disconnect</button></div></div>
<div id="card2" class="card"><div class="title"><div id="dot2" class="dot"></div><div id="name2" class="name">Agent</div><div id="state2" class="state">ACTIVE</div></div><div id="detail2" class="detail"></div><div id="scope2" class="scope"></div><div class="actions"><button id="resume2" class="resume">Resume</button><button id="pause2">Pause</button><button id="stop2" class="stop">Disconnect</button></div></div>
<div id="card3" class="card"><div class="title"><div id="dot3" class="dot"></div><div id="name3" class="name">Agent</div><div id="state3" class="state">ACTIVE</div></div><div id="detail3" class="detail"></div><div id="scope3" class="scope"></div><div class="actions"><button id="resume3" class="resume">Resume</button><button id="pause3">Pause</button><button id="stop3" class="stop">Disconnect</button></div></div>
<div id="hint">Ctrl + Alt + Esc pauses every agent.</div>
</div></div></body></html>
