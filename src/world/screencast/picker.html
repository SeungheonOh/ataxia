<!doctype html>
<html lang="en"><head><title>Share a source</title><style>
body { margin:0; width:100%; height:100%; font-size:13px; }
div { display:block; box-sizing:border-box; }
#panel { width:100%; height:100%; padding:0 var(--inset); border:var(--frame) solid var(--ink); display:flex; flex-direction:column; gap:var(--section); }
#panel { overflow-y:auto; }
.share-heading { height:var(--control); display:flex; align-items:center; flex-shrink:0; }
h1 { display:block; margin:0; font-size:var(--heading); font-weight:bold; }
#app { font-size:12px; color:var(--muted); flex-shrink:0; }
#sources { flex:1; min-height:48px; overflow-y:auto; }
.action { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#selection { min-height:16px; font-size:12px; flex-shrink:0; }
#footer { display:flex; flex-wrap:wrap; gap:0 var(--gap); flex-shrink:0; }
#sources .action { display:block; width:100%; }
#region { align-self:flex-start; }
#footer { justify-content:flex-end; }
#footer .action { width:auto; }
#privacy { font-size:11px; flex-shrink:0; }
</style><meta charset="utf-8"><link rel="stylesheet" href="../web/ui/document.css"><script src="../web/ui/document.js" defer="defer"></script></head><body class="shell screencast-picker"><div id="panel"><div class="share-heading"><h1>Share a source</h1></div><div id="app">Screen sharing request</div>
<input class="action" type="button" id="region" value="Draw a canvas region"><div id="sources" data-html="sources"></div>
<div id="selection">Choose an application or draw a canvas region.</div>
<div id="footer"><input class="action" type="button" id="cancel" value="Cancel"><input class="action" type="button" id="share" disabled="disabled" value="Share"></div>
<div id="privacy">Only the selected source is shared. Stop sharing at any time.</div></div></body></html>
