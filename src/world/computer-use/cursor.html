<!doctype html>
<html lang="en"><head><title>Agent cursor</title><style>
body { --accent:var(--ink); margin:0; width:100%; height:100%; font-size:11px; }
div { display:block; }
#tag { position:absolute; left:0; top:0; right:0; bottom:0; padding:0 var(--inset); border:var(--frame) solid var(--ink); border-left:4px solid var(--accent); }
#name { font-weight:bold; }
#state { font-size:10px; margin-top:0; }
#name, #state { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@keyframes pointer-click { from { background:var(--accent); color:white; } to { background:var(--paper); color:var(--ink); } }
#tag.clicked { animation:pointer-click 180ms ease-out; }
@media(prefers-reduced-motion:reduce){#tag.clicked{animation:none}}
</style><meta charset="utf-8"><link rel="stylesheet" href="../web/ui/document.css"><script src="../web/ui/document.js" defer="defer"></script></head><body class="shell computer-use-cursor"><div id="tag"><div id="name">Agent</div><div id="state">Connected</div></div></body></html>
