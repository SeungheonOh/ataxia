<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commonplace — notes</title>
<link rel="stylesheet" href="../ui/document.css">
<link rel="stylesheet" href="notes.css">
<script src="../ui/document.js" defer></script>
<script type="module" src="app.mjs"></script>
</head>
<body class="shell notebook">
<div id="panel">
  <header id="topbar"><strong>COMMONPLACE</strong><span class="muted">a place for unfinished thoughts</span><span class="spring"></span><span id="save-state" role="status">Opening…</span><button id="retry-save" data-action="noop" hidden>Retry</button><button id="close-notebook" data-action="noop" disabled>Close</button></header>
  <nav id="tools" aria-label="Notebook tools">
    <button id="all-notes" data-action="noop" class="selected" disabled>All notes <span id="count">0</span></button>
    <button id="pinned-notes" data-action="noop" disabled>Pinned</button>
    <button id="archived-notes" data-action="noop" disabled>Archive</button>
    <span class="divider" aria-hidden="true"></span>
    <label id="find-label">Find <input id="find" type="text" placeholder="words or #tags" autocomplete="off" disabled></label>
    <button id="clear-filter" data-action="noop" hidden>Clear</button>
    <span class="spring"></span><button id="new-note" data-action="noop" disabled>+ New note</button>
  </nav>
  <main id="workspace">
    <section id="board" aria-label="Note cards"></section>
    <div id="empty" hidden>No notes here. <button id="empty-new" data-action="noop">Write one</button></div>
    <section id="editor" aria-label="Note editor" hidden>
      <div class="editor-toolbar"><button id="back" data-action="noop">← Cards</button><span class="spring"></span><button id="write-mode" data-action="noop">Write</button><button id="split-mode" data-action="noop" class="selected">Write + read</button><button id="read-mode" data-action="noop">Read</button><span class="divider" aria-hidden="true"></span><button id="pin-note" data-action="noop">Pin</button><button id="archive-note" data-action="noop">Archive</button></div>
      <label class="sr-only" for="title">Note title</label><input id="title" type="text" maxlength="120" placeholder="Untitled note" autocomplete="off">
      <label class="tag-line">Tags <input id="tags" type="text" placeholder="#ideas #work" autocomplete="off"></label>
      <div id="pages" class="split"><div id="write-pane"><label class="pane-label" for="body">PLAIN TEXT / MARKDOWN</label><textarea id="body" spellcheck="false" maxlength="64000" placeholder="A thought, a list, a question…"></textarea></div><div id="read-pane"><div class="pane-label">READING VIEW</div><article id="reading" class="markdown"></article></div></div>
      <aside id="connections"><span class="muted">Linked from</span><span id="backlinks"></span></aside>
    </section>
  </main>
  <footer><span id="context">Your notes stay on this computer.</span><span class="spring"></span><span id="shortcuts">Ctrl+N new · Ctrl+F find · Esc cards</span></footer>
</div>
</body>
</html>
