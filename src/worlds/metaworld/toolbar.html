<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>World controls</title>
<link rel="stylesheet" href="../../world/web/ui/document.css"><style>#panel{display:flex;gap:8px;align-items:center;height:18px;padding:0 8px;border:1px solid var(--ink)}#caption{flex:1;overflow:hidden;text-overflow:ellipsis;font-weight:bold}#workspace{color:var(--muted)}@media(max-width:379px){#caption{display:none}}</style>
<script src="../../world/web/ui/document.js" defer></script></head><body class="shell"><div id="panel"><span id="caption" data-property="caption">Canvas</span><button id="overview" data-action="action" data-argument="overview">Overview</button><button class="active" data-action="action" data-argument="previous-workspace">↑</button><span class="active" id="workspace" data-property="workspace">1</span><button class="active" data-action="action" data-argument="next-workspace">↓</button><button data-action="action" data-argument="terminal">Terminal</button></div><script>addEventListener('ui-state',({detail:s})=>{const view=document.getElementById('overview');view.textContent=s.standalone?'Canvas':s.active?'Exit':'Overview';view.dataset.argument=s.standalone?'mode-canvas':'overview';document.querySelectorAll('.active').forEach(n=>n.hidden=!s.active);});</script></body></html>
